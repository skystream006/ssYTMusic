name: Cleanup Releases

on:
  workflow_dispatch:

concurrency:
  group: cleanup-releases
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Keep the five most recent releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          releases="$(gh api --paginate --slurp \
            "repos/${GH_REPO}/releases?per_page=100")"
          release_ids="$(jq -r '
            add
            | sort_by(.published_at // .created_at, .id)
            | reverse
            | .[5:]
            | .[].id
          ' <<< "$releases")"

          if [[ -z "$release_ids" ]]; then
            echo "Nothing to delete; the repository has five or fewer releases."
            exit 0
          fi

          while IFS= read -r release_id; do
            echo "Deleting release ${release_id}"
            gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}"
          done <<< "$release_ids"
